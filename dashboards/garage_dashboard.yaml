title: Garage
kiosk_mode:
  user_settings:
    - users:
        - walldisplay
      hide_header: true
      hide_sidebar: true
views:
  - title: Garage
    path: garage
    panel: true
    background: "#0d0f10"
    cards:
      - type: custom:layout-card
        layout_type: grid
        layout:
          # Total: 960×472px (≈961×473)
          # Sidebar: 52px
          # Area image: 209px+209px = 418px (+ gap) = 424px wide
          # Cards: 233px each = square (row height = 233px)
          # 52 + 209+209 + 233+233 + 4×6px gaps = 960px
          # 233+233 + 6px gap = 472px tall
          grid-template-columns: 52px 209px 209px 233px 233px
          grid-template-rows: 233px 233px
          gap: 6px
          padding: 0
          margin: 0
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              border: none !important;
              box-shadow: none !important;
              border-radius: 0 !important;
              margin: 0 !important;
            }

        cards:

          # ─── SIDEBAR ─── col 1, rows 1-2 ────────────────────────────────
          # Black strip flush with screen edge, 2 nav icons centered
          - type: custom:layout-card
            layout_type: grid
            layout:
              grid-template-columns: 1fr
              grid-template-rows: auto auto
              align-content: center
              justify-items: start
              gap: 20px
              padding: 0 0 0 4px
            view_layout:
              grid-column: 1 / 2
              grid-row: 1 / 3
            card_mod:
              style: |
                ha-card {
                  background: #000000 !important;
                  border: none !important;
                  border-radius: 0 !important;
                  box-shadow: none !important;
                  height: 100%;
                  margin: 0;
                }
            cards:
              # Home (inactive)
              - type: custom:button-card
                show_icon: false
                show_name: false
                show_entity_picture: true
                entity_picture: /local/assets/icons/home.png
                tap_action:
                  action: navigate
                  navigation_path: /home-tablet/home
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - width: 44px
                    - height: 44px
                    - border-radius: 10px
                    - margin-left: -10px
                  entity_picture:
                    - width: 28px
                    - height: 28px
                    - border-radius: 0

              # Garage (active — this dashboard)
              - type: custom:button-card
                show_icon: false
                show_name: false
                show_entity_picture: true
                entity_picture: /local/assets/icons/garage-active.png
                tap_action:
                  action: navigate
                  navigation_path: /garage-tablet/garage
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - width: 44px
                    - height: 44px
                    - border-radius: 10px
                    - margin-left: -10px
                  entity_picture:
                    - width: 28px
                    - height: 28px
                    - border-radius: 0

          # ─── AREA IMAGE ─── cols 2-3, rows 1-2 ──────────────────────────
          # 424px wide (209+6+209) × 472px tall
          - type: custom:stack-in-card
            mode: vertical
            view_layout:
              grid-column: 2 / 4
              grid-row: 1 / 3
            card_mod:
              style: |
                ha-card {
                  background: url('/local/assets/garage-light-on.png') center bottom / cover no-repeat !important;
                  border-radius: 16px !important;
                  overflow: hidden !important;
                  border: none !important;
                  box-shadow: none !important;
                  height: 455px;
                  position: relative !important;
                }
            cards:
              # Overlay — transparent picture-elements, floats over the background
              - type: picture-elements
                image: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
                card_mod:
                  style: |
                    ha-card {
                      position: absolute !important;
                      inset: 0 !important;
                      background: transparent !important;
                      border: none !important;
                      box-shadow: none !important;
                    }
                elements:
                  # Time - top left
                  - type: custom:button-card
                    entity: sensor.time
                    show_name: false
                    show_icon: false
                    show_state: true
                    tap_action:
                      action: none
                    styles:
                      card:
                        - background: transparent
                        - border: none
                        - box-shadow: none
                        - padding: 0
                      state:
                        - font-family: "'Poppins', sans-serif"
                        - font-size: 48px
                        - font-weight: 600
                        - color: white
                        - text-shadow: 2px 2px 24px rgba(0,0,0,0.8)
                        - letter-spacing: "-1px"
                    style:
                      top: 8%
                      left: 5%
                      transform: translate(0, 0)

                  # Date - immediately below time
                  - type: custom:button-card
                    entity: sensor.date
                    show_name: false
                    show_icon: false
                    show_state: true
                    tap_action:
                      action: none
                    state_display: |
                      [[[
                        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
                        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
                        const d = new Date();
                        return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()];
                      ]]]
                    styles:
                      card:
                        - background: transparent
                        - border: none
                        - box-shadow: none
                        - padding: 0
                      state:
                        - font-family: "'Poppins', sans-serif"
                        - font-size: 13px
                        - font-weight: 300
                        - color: "rgba(255,255,255,0.7)"
                    style:
                      top: 22%
                      left: 5%
                      transform: translate(0, 0)

          # ─── GARAGE SPOTS ─── col 4, row 1 ─ 233×233px ──────────────────
          - type: custom:button-card
            view_layout:
              grid-column: 4 / 5
              grid-row: 1 / 2
            entity: light.carport_light_0
            show_name: true
            show_icon: false
            show_state: true
            show_entity_picture: true
            name: Garage Spots
            entity_picture: >
              [[[
                return entity && entity.state === 'on'
                  ? '/local/assets/icons/light-on.png'
                  : '/local/assets/icons/light-off.png';
              ]]]
            state_display: |
              [[[
                const isOn = entity && entity.state === 'on';
                return 'Garage | ' + (isOn ? 'On' : 'Off');
              ]]]
            tap_action:
              action: toggle
            styles:
              card:
                - background: >
                    [[[
                      const isOn = entity && entity.state === 'on';
                      return `url('/local/assets/${isOn ? 'outdoor-spot-on' : 'outdoor-spot-off'}.jpg') center/cover #1e2022`;
                    ]]]
                - border: none
                - border-radius: 16px
                - height: 100%
                - box-shadow: none
              grid:
                - grid-template-areas: '"i n" "i s"'
                - grid-template-columns: min-content 1fr
                - grid-template-rows: min-content min-content
                - gap: 2px 9px
                - padding: 13px
                - align-content: start
                - justify-items: start
                - align-items: start
              img_cell:
                - background: "#141414"
                - border-radius: 16px
                - padding: 6px
                - width: 36px
                - height: 36px
                - display: flex
                - align-items: center
                - justify-content: center
              entity_picture:
                - width: 26px
                - height: 26px
                - border-radius: 0
              name:
                - color: white
                - font-family: "'Poppins', sans-serif"
                - font-size: 18px
                - font-weight: 500
                - text-align: left
                - justify-self: start
              state:
                - color: "#5b5b5c"
                - font-family: "'Poppins', sans-serif"
                - font-size: 12px
                - text-align: left
                - justify-self: start
                - margin-top: -10px

          # ─── CARPORT ─── col 4, row 2 ─ 233×233px ───────────────────────
          - type: custom:button-card
            view_layout:
              grid-column: 4 / 5
              grid-row: 2 / 3
            entity: light.carport_light_1
            show_name: true
            show_icon: false
            show_state: true
            show_entity_picture: true
            entity_picture: >
              [[[
                return entity && entity.state === 'on'
                  ? '/local/assets/icons/light-on.png'
                  : '/local/assets/icons/light-off.png';
              ]]]
            name: Carport
            state_display: |
              [[[
                const isOn = entity && entity.state === 'on';
                return 'Carport | ' + (isOn ? 'On' : 'Off');
              ]]]
            tap_action:
              action: toggle
            styles:
              card:
                - background: >
                    [[[
                      const isOn = entity && entity.state === 'on';
                      return `url('/local/assets/${isOn ? 'carport-lights-on' : 'carport-lights-off'}.jpg') center/cover #1e2022`;
                    ]]]
                - border: none
                - border-radius: 16px
                - height: 100%
                - box-shadow: none
              grid:
                - grid-template-areas: '"i n" "i s"'
                - grid-template-columns: min-content 1fr
                - grid-template-rows: min-content min-content
                - gap: 2px 9px
                - padding: 13px
                - align-content: start
                - justify-items: start
                - align-items: start
              img_cell:
                - background: "#141414"
                - border-radius: 16px
                - padding: 6px
                - width: 36px
                - height: 36px
                - display: flex
                - align-items: center
                - justify-content: center
              entity_picture:
                - width: 26px
                - height: 26px
                - border-radius: 0
              name:
                - color: white
                - font-family: "'Poppins', sans-serif"
                - font-size: 18px
                - font-weight: 500
                - text-align: left
                - justify-self: start
              state:
                - color: "#5b5b5c"
                - font-family: "'Poppins', sans-serif"
                - font-size: 12px
                - text-align: left
                - justify-self: start
                - margin-top: -10px

          # ─── HEAT PUMP ─── col 5, rows 1-2 ─ 233×472px ──────────────────
          - type: custom:garage-climate-card
            view_layout:
              grid-column: 5 / 6
              grid-row: 1 / 3
            entity: climate.garage_heat_pump
            name: Heat Pump
