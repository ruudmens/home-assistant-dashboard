title: Luxury Remote
button_card_templates:
  luxury_nav:
    show_state: false
    size: 27px
    styles:
      card:
        - border-radius: 18px
        - border: 1px solid rgba(213, 183, 122, 0.24)
        - background: linear-gradient(145deg, rgba(36, 39, 37, 0.96), rgba(18, 20, 20, 0.96))
        - color: '#f6f3ec'
        - padding: 15px
      icon:
        - color: '#d5b77a'
      name:
        - font-size: 13px
        - font-weight: 600
views:
  - title: Remote
    path: remote
    icon: mdi:remote
    type: sections
    max_columns: 1
    dense_section_placement: true
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        content: |
          # Luxury Remote
          The most useful controls, ordered for one-handed access.
        card_mod:
          style: |
            ha-card {
              background: transparent;
              border: 0;
              color: #f6f3ec;
            }
    sections:
      - type: grid
        background:
          color: '#1c1a16'
          opacity: 92
        cards:
          - type: heading
            heading: Security
            icon: mdi:shield-home-outline
          - type: custom:button-card
            entity: alarm_control_panel.alarmo
            name: Alarmo
            show_state: true
            state:
              - value: disarmed
                color: '#a7c7a0'
              - value: armed_home
                color: '#a7c7a0'
              - value: armed_away
                color: '#a7c7a0'
              - value: armed_night
                color: '#a7c7a0'
              - value: armed_vacation
                color: '#a7c7a0'
              - value: armed_custom_bypass
                color: '#a7c7a0'
              - value: arming
                color: '#d5b77a'
              - value: pending
                color: '#d5b77a'
              - value: disarming
                color: '#d5b77a'
              - value: triggered
                color: '#d88d75'
              - value: unavailable
                color: '#777972'
            tap_action:
              action: more-info
              confirmation:
                title: Security
                text: Open alarm controls?
          - type: custom:button-card
            entity: lock.virtual_front_door_lock
            name: Front door
            show_state: true
            state:
              - value: locked
                color: '#a7c7a0'
              - value: unlocked
                color: '#d88d75'
              - value: open
                color: '#d88d75'
              - value: jammed
                color: '#d88d75'
              - value: locking
                color: '#d5b77a'
              - value: unlocking
                color: '#d5b77a'
              - value: unavailable
                color: '#777972'
            tap_action:
              action: toggle
              confirmation:
                title: Front door
                text: Change the front door lock state?
          - type: custom:button-card
            entity: lock.back_door
            name: Back door
            show_state: true
            state:
              - value: locked
                color: '#a7c7a0'
              - value: unlocked
                color: '#d88d75'
              - value: open
                color: '#d88d75'
              - value: jammed
                color: '#d88d75'
              - value: locking
                color: '#d5b77a'
              - value: unlocking
                color: '#d5b77a'
              - value: unavailable
                color: '#777972'
            tap_action:
              action: toggle
              confirmation:
                title: Back door
                text: Change the back door lock state?
      - type: grid
        background:
          color: '#171a19'
          opacity: 90
        cards:
          - type: heading
            heading: Quick lights
            icon: mdi:lightbulb-group-outline
          - type: tile
            entity: light.main_light
            name: Main
            color: amber
          - type: tile
            entity: light.kitchen_light
            name: Kitchen
            color: amber
          - type: tile
            entity: light.bedroom_light
            name: Bedroom
            color: amber
          - type: tile
            entity: light.garage_2
            name: Garage
            color: amber
          - type: button
            entity: scene.all_lights
            name: All Lights
            icon: mdi:lightbulb-group
            tap_action:
              action: perform-action
              perform_action: scene.turn_on
              target:
                entity_id: scene.all_lights
      - type: grid
        background:
          color: '#1c1a16'
          opacity: 90
        cards:
          - type: heading
            heading: Comfort
            icon: mdi:home-thermometer-outline
          - type: thermostat
            entity: climate.my_ecobee
            name: Ecobee
          - type: weather-forecast
            entity: weather.home
            forecast_type: daily
            show_forecast: false
      - type: grid
        background:
          color: '#171a19'
          opacity: 90
        cards:
          - type: heading
            heading: Media
            icon: mdi:music-circle-outline
          - type: media-control
            entity: media_player.living_room
          - type: custom:stack-in-card
            cards:
              - type: tile
                entity: script.radio_play
                name: GKR Radio
                icon: mdi:radio
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.radio_play
              - type: tile
                entity: input_number.radio_volume
                name: Radio volume
      - type: grid
        background:
          color: '#1c1a16'
          opacity: 90
        cards:
          - type: heading
            heading: People & presence
            icon: mdi:account-group-outline
          - type: tile
            entity: person.kcam
            name: Kcam
          - type: tile
            entity: person.mom
            name: Mom
          - type: tile
            entity: binary_sensor.livingroom_matter_pir_occupancy
            name: Living Room occupancy
          - type: tile
            entity: binary_sensor.zachary_s_s21_ultra_presence
            name: Zachary presence
      - type: grid
        background:
          color: '#171a19'
          opacity: 90
        cards:
          - type: heading
            heading: Cameras
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.livingroom_2
            name: Living Room
            camera_view: auto
            show_state: false
            tap_action:
              action: more-info
          - type: picture-entity
            entity: camera.backyard_backyard_motion_snapshot
            name: Backyard snapshot
            camera_view: auto
            show_state: false
            tap_action:
              action: more-info
          - type: picture-entity
            entity: camera.blink_backyard
            name: Blink Backyard
            camera_view: auto
            show_state: false
            tap_action:
              action: more-info
          - type: picture-entity
            entity: camera.bedroom_bedroom_motion_snapshot
            name: Bedroom snapshot
            camera_view: auto
            show_state: false
            tap_action:
              action: more-info
      - type: grid
        background:
          color: '#171a19'
          opacity: 88
        cards:
          - type: heading
            heading: Dashboards
            icon: mdi:view-dashboard-outline
          - type: custom:button-card
            template: luxury_nav
            name: Home
            icon: mdi:home-heart
            tap_action:
              action: navigate
              navigation_path: /luxury-home
          - type: custom:button-card
            template: luxury_nav
            name: Garage
            icon: mdi:garage
            tap_action:
              action: navigate
              navigation_path: /luxury-garage
