    # Kitchen lights - normal
    light.coffee_corner:
      state: "on"
      brightness: 40
    light.kitchen_spot_1:
      state: "on"
      brightness: 40
      color_temp: 368
    light.kitchen_pendant_2:
      state: "on"
      brightness: 40
      color_temp: 368
    light.kitchen_spot_2:
      state: "on"
      brightness: 40
      color_temp: 368
    light.kitchen_pendant_1:
      state: "on"
      brightness: 40
      color_temp: 368
    light.kitchen_spot_3:
      state: "on"
