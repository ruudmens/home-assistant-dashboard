# Home Scenes
# These scenes control the ambiance and lighting throughout the house.
#
# Entity IDs below are placeholders (kitchen_spot_1, sofa_floor_lamp, etc.)
# — rename them to match your own lights, or find-and-replace them across
# this file, automations.yaml, and the dashboards to match your setup.

# Sleep Mode - All indoor lights off, outdoor/garage lights remain unchanged
- name: Sleep Mode
  entities:
    # Scene trackers — reset all active-scene flags
    input_boolean.scene_cozy: 'off'
    input_boolean.scene_gameboard: 'off'
    input_boolean.scene_cooking: 'off'

    # Hallway lights
    light.entrance: "off"
    light.hall: "off"

    # Living room lights
    light.media_cabinet: "off"
    light.sofa_floor_lamp: "off"
    light.floor_lamp_3: "off"
    light.floor_lamp_1: "off"
    light.floor_lamp_2: "off"
    light.window_floor_lamp: "off"

    # Kitchen lights
    light.coffee_corner: "off"
    light.kitchen_spot_1: "off"
    light.kitchen_pendant_2: "off"
    light.kitchen_spot_2: "off"
    light.kitchen_pendant_1: "off"
    light.kitchen_spot_3: "off"

    # Dining room lights
    light.dining_table: "off"
    light.kitchen_led_strip_1: "off"
    light.kitchen_led_strip_2: "off"
    light.dining_cabinet: "off"
    switch.cabinet_accent_light: "off"

    # Family room lights
    light.family_room: "off"
    light.corridor: "off"

# Lights On - All indoor lights at modest brightness (50%)
- name: Lights On
  entities:
